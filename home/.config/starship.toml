format = "$directory$git_branch$git_status$character"
right_format = "$time"
add_newline = false

[directory]
format = "[$path]($style)"
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = " on [$branch](bold purple)"

[git_status]
format = '([ $all_status$ahead_behind]($style) )'

[time]
disabled = false
format = "[$time]($style)"
time_format = "%H:%M"
style = "dimmed white"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
